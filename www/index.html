<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>FocusGold 数2BC</title>
<style>
:root {
  --bg: #0f0f13;
  --bg2: #16161d;
  --bg3: #1e1e28;
  --bg4: #252533;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #e8e8f0;
  --text2: #9090a8;
  --text3: #5a5a72;
  --accent: #6c63ff;
  --accent2: #8b84ff;
  --accent-bg: rgba(108,99,255,0.12);
  --green: #4ade80;
  --green-bg: rgba(74,222,128,0.1);
  --amber: #fbbf24;
  --amber-bg: rgba(251,191,36,0.1);
  --red: #f87171;
  --red-bg: rgba(248,113,113,0.1);
  --blue: #60a5fa;
  --blue-bg: rgba(96,165,250,0.1);
  --radius: 10px;
  --radius-lg: 16px;
  --bottom-h: 64px;
}
.light {
  --bg: #f4f4f8;
  --bg2: #ffffff;
  --bg3: #f0f0f5;
  --bg4: #e4e4ec;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.14);
  --text: #1a1a2e;
  --text2: #5a5a72;
  --text3: #9090a8;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.6; padding-bottom: var(--bottom-h); }

/* NAV */
nav.top-nav { position: sticky; top: 0; z-index: 100; background: rgba(15,15,19,0.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; height: 52px; gap: 8px; }
.light nav.top-nav { background: rgba(244,244,248,0.94); }
.nav-logo { font-size: 16px; font-weight: 700; color: var(--accent2); margin-right: auto; }
.nav-logo span { color: var(--text2); font-weight: 400; font-size: 11px; margin-left: 5px; }
.nav-streak { font-size: 13px; font-weight: 700; color: var(--amber); }
.nav-icon-btn { background: none; border: none; color: var(--text3); font-size: 18px; cursor: pointer; padding: 6px; border-radius: 8px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
.status-dot.online { background: var(--green); }

/* BOTTOM NAV */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: var(--bg2); border-top: 1px solid var(--border); display: flex; height: var(--bottom-h); padding-bottom: env(safe-area-inset-bottom, 0); }
.bn-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: none; background: none; color: var(--text3); font-size: 10px; cursor: pointer; font-family: inherit; transition: color 0.15s; }
.bn-icon { font-size: 20px; transition: transform 0.15s; }
.bn-tab.active { color: var(--accent2); }
.bn-tab.active .bn-icon { transform: translateY(-2px); }

/* CONTAINER */
.container { max-width: 960px; margin: 0 auto; padding: 18px 15px; }

/* AUTH */
#auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
.auth-logo { font-size: 30px; font-weight: 700; color: var(--accent2); margin-bottom: 4px; }
.auth-sub { font-size: 12px; color: var(--text3); margin-bottom: 28px; }
.auth-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px; width: 100%; max-width: 360px; }
.auth-tabs { display: flex; gap: 4px; margin-bottom: 18px; background: var(--bg3); border-radius: var(--radius); padding: 3px; }
.auth-tab { flex: 1; padding: 8px; border: none; background: none; color: var(--text2); font-size: 13px; border-radius: 8px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.auth-tab.active { background: var(--bg2); color: var(--text); }
.auth-input { width: 100%; padding: 11px 13px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); font-size: 14px; font-family: inherit; margin-bottom: 9px; outline: none; }
.auth-input:focus { border-color: var(--accent); }
.auth-btn { width: 100%; padding: 12px; border-radius: var(--radius); border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 8px; transition: all 0.15s; }
.auth-btn.primary { background: var(--accent); color: #fff; }
.auth-btn.google { background: var(--bg3); color: var(--text); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; gap: 8px; }
.auth-divider { text-align: center; color: var(--text3); font-size: 12px; margin: 8px 0; }
.auth-err { color: var(--red); font-size: 12px; margin-bottom: 8px; text-align: center; min-height: 16px; }
.auth-skip { color: var(--text3); font-size: 12px; text-align: center; cursor: pointer; text-decoration: underline; margin-top: 10px; }

/* LOADING */
#loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 14px; }
.loading-logo { font-size: 22px; font-weight: 700; color: var(--accent2); }
.loading-spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--bg4); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
.loading-text { font-size: 12px; color: var(--text3); }
@keyframes spin { to { transform: rotate(360deg); } }

/* STATS */
.stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 18px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 13px; }
.stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px; }
.stat-value { font-size: 20px; font-weight: 700; }
.stat-value.accent { color: var(--accent2); }
.stat-value.green { color: var(--green); }
.stat-value.amber { color: var(--amber); }

/* TASKS */
.section-title { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 9px; }
.task-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }
.task-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 13px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: border-color 0.15s; }
.task-card:hover, .task-card:active { border-color: var(--border2); background: var(--bg3); }
.task-card.done { opacity: 0.38; }
.task-checkbox { width: 19px; height: 19px; border-radius: 50%; border: 2px solid var(--border2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; transition: all 0.15s; }
.task-card.done .task-checkbox { background: var(--green); border-color: var(--green); color: #0a0a0e; }
.task-info { flex: 1; min-width: 0; }
.task-num { font-size: 13px; font-weight: 600; }
.task-meta { font-size: 11px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-badge { font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 20px; flex-shrink: 0; }
.badge-r1 { background: var(--amber-bg); color: var(--amber); }
.badge-r2 { background: var(--blue-bg); color: var(--blue); }
.badge-r3 { background: var(--red-bg); color: var(--red); }

/* WEAK */
.weak-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }
.weak-card { background: var(--bg2); border: 1px solid rgba(248,113,113,0.2); border-radius: var(--radius); padding: 11px 13px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.weak-card:hover { border-color: rgba(248,113,113,0.4); }

/* PROGRESS */
.chapters-grid { display: flex; flex-direction: column; gap: 10px; }
.chapter-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 17px; }
.chapter-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; cursor: pointer; user-select: none; }
.chapter-name { font-size: 13px; font-weight: 600; }
.chapter-range { font-size: 11px; color: var(--text3); margin-top: 2px; }
.chapter-pct { font-size: 13px; font-weight: 700; color: var(--accent2); }
.progress-bar { height: 4px; background: var(--bg4); border-radius: 4px; overflow: hidden; margin-bottom: 11px; }
.progress-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg,var(--accent),var(--accent2)); transition: width 0.4s; }
.problem-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(34px,1fr)); gap: 4px; max-height: 0; overflow: hidden; transition: max-height 0.3s; }
.chapter-card.expanded .problem-grid { max-height: 800px; }
.prob-btn { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--border); background: var(--bg3); color: var(--text3); font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; position: relative; transition: all 0.1s; }
.prob-btn:hover { border-color: var(--accent); color: var(--accent2); }
.prob-btn.learned { background: var(--green-bg); border-color: rgba(74,222,128,0.3); color: var(--green); }
.prob-btn.learned-sanka { background: var(--amber-bg); border-color: rgba(251,191,36,0.35); color: var(--amber); }
.prob-btn.learned-batu { background: var(--red-bg); border-color: rgba(248,113,113,0.35); color: var(--red); }
.prob-btn.r1 { background: var(--amber-bg); border-color: rgba(251,191,36,0.3); color: var(--amber); }
.prob-btn.r2 { background: var(--blue-bg); border-color: rgba(96,165,250,0.3); color: var(--blue); }
.prob-btn.r3 { background: rgba(248,113,113,0.15); border-color: rgba(248,113,113,0.3); color: var(--red); }
.prob-btn.mastered { background: rgba(108,99,255,0.15); border-color: rgba(108,99,255,0.3); color: var(--accent2); }
.prob-btn.mastered-sanka { background: rgba(108,99,255,0.1); border-color: rgba(251,191,36,0.4); color: var(--accent2); }
.prob-btn.mastered-batu { background: rgba(108,99,255,0.08); border-color: rgba(248,113,113,0.4); color: var(--red); }
.prob-btn.has-memo::after { content:''; position:absolute; top:2px; right:2px; width:5px; height:5px; border-radius:50%; background:var(--accent2); }
.legend { display: flex; flex-wrap: wrap; gap: 5px 10px; margin-bottom: 14px; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text2); }
.legend-dot { width: 8px; height: 8px; border-radius: 3px; }

/* CALENDAR */
.cal-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cal-nav-btn { background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); padding: 5px 12px; cursor: pointer; font-size: 14px; }
.cal-month-label { font-size: 15px; font-weight: 600; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
.cal-dow { text-align: center; font-size: 10px; color: var(--text3); padding: 3px 0; font-weight: 600; }
.cal-day { aspect-ratio: 1; border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--text2); }
.cal-day.has-activity { background: var(--accent-bg); color: var(--accent2); font-weight: 600; }
.cal-day.today { border: 1.5px solid var(--accent); }
.cal-day-count { font-size: 8px; color: var(--text3); line-height: 1; }
.cal-day.has-activity .cal-day-count { color: var(--accent2); opacity: 0.7; }
.chart-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 12px; }
.chart-title { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 12px; }
.bar-chart { display: flex; align-items: flex-end; gap: 5px; height: 72px; }
.bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; }
.bar { width: 100%; border-radius: 3px 3px 0 0; background: var(--accent-bg); min-height: 2px; }
.bar.active { background: var(--accent); }
.bar-label { font-size: 8px; color: var(--text3); }
.bar-val { font-size: 8px; color: var(--text3); }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: flex; align-items: flex-end; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 14px 18px 32px; width: 100%; max-width: 480px; transform: translateY(16px); transition: transform 0.22s; max-height: 92vh; overflow-y: auto; }
.modal-overlay.open .modal { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 14px; }
.modal-close-row { display: flex; justify-content: flex-end; margin-bottom: 4px; }
.modal-x { background: none; border: none; color: var(--text3); font-size: 22px; cursor: pointer; line-height: 1; }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
.modal-sub { font-size: 12px; color: var(--text3); margin-bottom: 14px; }
.modal-actions { display: flex; flex-direction: column; gap: 8px; }
.modal-btn { padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--bg3); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; font-family: inherit; width: 100%; transition: all 0.15s; }
.modal-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.modal-btn-sub { font-size: 11px; color: rgba(255,255,255,0.55); font-weight: 400; margin-top: 2px; }
.result-selector { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin: 9px 0 13px; }
.result-opt { padding: 11px 5px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--bg3); cursor: pointer; text-align: center; font-family: inherit; transition: all 0.15s; }
.result-opt.selected-maru { background: var(--green-bg); border-color: rgba(74,222,128,0.5); }
.result-opt.selected-sanka { background: var(--amber-bg); border-color: rgba(251,191,36,0.5); }
.result-opt.selected-batu { background: var(--red-bg); border-color: rgba(248,113,113,0.5); }
.result-opt-sym { font-size: 19px; display: block; margin-bottom: 3px; }
.result-opt-label { font-size: 10px; color: var(--text2); display: block; line-height: 1.3; }
.memo-label { font-size: 11px; color: var(--text3); margin-top: 10px; margin-bottom: 4px; }
.memo-input { width: 100%; padding: 9px 11px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); font-size: 13px; font-family: inherit; resize: vertical; min-height: 64px; outline: none; margin-bottom: 4px; }
.memo-input:focus { border-color: var(--accent); }

/* SETTINGS */
.settings-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 10px; }
.settings-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--text2); }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.settings-row:last-child { border-bottom: none; }
.settings-label { font-size: 13px; }
.settings-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
.toggle { width: 40px; height: 22px; background: var(--bg4); border-radius: 11px; position: relative; cursor: pointer; border: none; transition: background 0.2s; flex-shrink: 0; }
.toggle.on { background: var(--accent); }
.toggle::after { content:''; position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: left 0.2s; }
.toggle.on::after { left: 21px; }
.danger-btn { padding: 6px 13px; border-radius: var(--radius); border: 1px solid rgba(248,113,113,0.3); background: var(--red-bg); color: var(--red); font-size: 12px; cursor: pointer; font-family: inherit; font-weight: 600; }
.small-btn { padding: 6px 13px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--bg3); color: var(--text); font-size: 12px; cursor: pointer; font-family: inherit; }
.signout-btn { width: 100%; padding: 11px; border-radius: var(--radius); border: 1px solid rgba(248,113,113,0.3); background: var(--red-bg); color: var(--red); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }

/* TOAST */
.toast { position: fixed; bottom: calc(var(--bottom-h) + 10px); left: 50%; transform: translateX(-50%) translateY(60px); background: var(--bg3); border: 1px solid var(--border2); border-radius: 24px; padding: 8px 18px; font-size: 13px; color: var(--text); transition: transform 0.3s; z-index: 400; white-space: nowrap; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* CONFETTI */
.confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 500; overflow: hidden; }
.cp { position: absolute; width: 8px; height: 8px; animation: cf 2s ease-in forwards; opacity: 0; }
@keyframes cf { 0%{transform:translateY(-10px) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }

/* EMPTY */
.empty-state { text-align: center; padding: 36px 16px; color: var(--text3); font-size: 13px; }
.empty-icon { font-size: 30px; margin-bottom: 8px; }

/* PAGE HEADER */
.page-header { margin-bottom: 14px; }
.page-title { font-size: 19px; font-weight: 700; }
.page-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

@media (max-width: 480px) {
  .stats-row { grid-template-columns: repeat(2,1fr); }
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading-screen">
  <div class="loading-logo">FocusGold</div>
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">接続中...</div>
</div>

<!-- AUTH -->
<div id="auth-screen" style="display:none">
  <div class="auth-logo">FocusGold</div>
  <div class="auth-sub">数2BC 復習アプリ</div>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" id="atab-login" onclick="switchAuthTab('login')">ログイン</button>
      <button class="auth-tab" id="atab-signup" onclick="switchAuthTab('signup')">新規登録</button>
    </div>
    <div id="auth-err" class="auth-err"></div>
    <input class="auth-input" type="email" id="auth-email" placeholder="メールアドレス" autocomplete="email" />
    <input class="auth-input" type="password" id="auth-pass" placeholder="パスワード（6文字以上）" autocomplete="current-password" />
    <div id="auth-pass2-wrap" style="display:none">
      <input class="auth-input" type="password" id="auth-pass2" placeholder="パスワード（確認）" autocomplete="new-password" />
    </div>
    <button class="auth-btn primary" id="auth-submit-btn" onclick="authSubmit()">ログイン</button>
    <div class="auth-divider">または</div>
    <button class="auth-btn google" onclick="authGoogle()">
      <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Googleでログイン
    </button>
    <div class="auth-skip" onclick="authAnonymous()">ログインせずに使う</div>
  </div>
</div>

<!-- TOP NAV -->
<nav class="top-nav" id="main-nav" style="display:none">
  <div class="nav-logo">FocusGold <span>数2BC</span></div>
  <span class="nav-streak" id="nav-streak">🔥 0</span>
  <div class="status-dot" id="status-dot" style="margin:0 2px"></div>
  <button class="nav-icon-btn" onclick="toggleTheme()" title="テーマ">☀</button>
</nav>

<!-- MAIN -->
<div id="main-content" style="display:none">

  <!-- TODAY -->
  <div id="tab-today" class="container">
    <div class="page-header">
      <div class="page-title">今日のタスク</div>
      <div class="page-sub" id="today-date"></div>
    </div>
    <div class="stats-row" id="stats-row"></div>
    <div class="section-title">復習タスク</div>
    <div class="task-list" id="task-list"></div>
    <div class="section-title" id="weak-title" style="display:none">苦手問題（×）</div>
    <div class="weak-list" id="weak-list"></div>
  </div>

  <!-- CALENDAR -->
  <div id="tab-calendar" class="container" style="display:none">
    <div class="page-header"><div class="page-title">学習カレンダー</div></div>
    <div class="cal-wrap">
      <div class="cal-header">

<script>
var firebaseConfig = {

window.switchAuthTab = function(mode) {

// ===== FIRESTORE =====
async function loadFromFirestore(uid) {
  try {
    var snap = await db.collection('users').doc(uid).get();
    if (snap.exists) {
      state = snap.data().state || {};
    } else {
      var local = localStorage.getItem('fg_state');
      state = local ? JSON.parse(local) : {};
      if (local) await saveToFirestore(uid);
    }
  } catch(e) {
    console.warn('Firestore load error:', e);
    var local = localStorage.getItem('fg_state');
    state = local ? JSON.parse(local) : {};
    setStatus('offline');
  }
}

async function saveToFirestore(uid) {
  var targetUid = uid || currentUid;
  if (!targetUid) return;
  try {
    setStatus('syncing');
    await db.collection('users').doc(targetUid).set({ state: state, updatedAt: Date.now() });
    localStorage.setItem('fg_state', JSON.stringify(state));
    setStatus('online');
    var el = document.getElementById('sync-status');
    if (el) el.textContent = '同期済み ' + new Date().toLocaleTimeString('ja-JP');
  } catch(e) {
    console.warn('Firestore save error:', e);
    localStorage.setItem('fg_state', JSON.stringify(state));
    setStatus('offline');
  }
}

function saveState() {
  localStorage.setItem('fg_state', JSON.stringify(state));
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(function() { saveToFirestore(); }, 800);
}

// ===== STATUS =====
function setStatus(s) {
  var dot = document.getElementById('status-dot');
  if (!dot) return;
  if (s === 'online') { dot.className = 'status-dot online'; }
  else if (s === 'syncing') { dot.className = 'status-dot'; dot.style.background = 'var(--amber)'; }
  else { dot.className = 'status-dot'; dot.style.background = 'var(--red)'; }
}

// ===== UTILS =====
function getProblems(ch) {
  if (ch.prefix) {
    var s = ch.startNum || 1;
    return Array.from({length: ch.count}, function(_, i) { return ch.prefix + (s + i); });
  }
  return Array.from({length: ch.end - ch.start + 1}, function(_, i) { return String(ch.start + i); });
}

function todayTs() {
  var d = new Date(); d.setHours(0,0,0,0); return d.getTime();
}

function daysSince(ts) {
  return Math.floor((todayTs() - ts) / 86400000);
}

function getStage(pid) {
  var s = state[pid];
  if (!s) return 'unlearned';
  var rev = s.reviews || [];
  var result = s.result || 'maru';
  if (rev.length >= 3) return result === 'maru' ? 'mastered' : result === 'sanka' ? 'mastered-sanka' : 'mastered-batu';
  if (daysSince(s.learnedAt) < REVIEW_DAYS[rev.length]) return result === 'maru' ? 'learned' : result === 'sanka' ? 'learned-sanka' : 'learned-batu';
  return ['r1','r2','r3'][rev.length];
}

function isDueToday(pid) {
  var s = state[pid];
  if (!s) return false;
  var rev = s.reviews || [];
  if (rev.length >= 3) return false;
  return daysSince(s.learnedAt) >= REVIEW_DAYS[rev.length];
}

// ===== STREAK =====
function updateStreak() {
  var days = {};
  Object.keys(state).forEach(function(pid) {
    var s = state[pid];
    if (!s) return;
    function addDay(ts) {
      var d = new Date(ts); d.setHours(0,0,0,0); days[d.getTime()] = true;
    }
    addDay(s.learnedAt);
    (s.reviews||[]).forEach(addDay);
  });
  var streak = 0;
  var cur = new Date(); cur.setHours(0,0,0,0);
  while (days[cur.getTime()]) { streak++; cur.setDate(cur.getDate() - 1); }
  var el = document.getElementById('nav-streak');
  if (el) el.textContent = '🔥 ' + streak;
}

// ===== TODAY =====
function renderToday() {
  var d = new Date();
  var dateEl = document.getElementById('today-date');
  if (dateEl) dateEl.textContent = d.toLocaleDateString('ja-JP', {year:'numeric',month:'long',day:'numeric',weekday:'short'});

  var tasks = [];
  CHAPTERS.forEach(function(ch) {
    getProblems(ch).forEach(function(pid) {
      if (isDueToday(pid)) tasks.push({ pid: pid, ch: ch.name, stage: (state[pid].reviews||[]).length });
    });
  });
  tasks.sort(function(a,b) { return a.stage - b.stage; });

  var totalLearned = 0, totalMastered = 0;
  var totalProblems = CHAPTERS.reduce(function(a,ch) { return a + (ch.prefix ? ch.count : ch.end - ch.start + 1); }, 0);
  Object.keys(state).forEach(function(pid) {
    if (state[pid]) { totalLearned++; if ((state[pid].reviews||[]).length >= 3) totalMastered++; }
  });

  var sr = document.getElementById('stats-row');
  if (sr) sr.innerHTML =
    '<div class="stat-card"><div class="stat-label">今日のタスク</div><div class="stat-value amber">' + tasks.length + '</div></div>' +
    '<div class="stat-card"><div class="stat-label">学習済</div><div class="stat-value accent">' + totalLearned + '</div></div>' +
    '<div class="stat-card"><div class="stat-label">完全習得</div><div class="stat-value green">' + totalMastered + '</div></div>' +
    '<div class="stat-card"><div class="stat-label">全問題</div><div class="stat-value" style="color:var(--text2)">' + totalProblems + '</div></div>';

  var bCls = ['badge-r1','badge-r2','badge-r3'];
  var bLbl = ['1回目復習','2回目復習','最終復習'];
  var chipCols = {maru:'var(--green)',sanka:'var(--amber)',batu:'var(--red)'};
  var chipLbls = {maru:'○',sanka:'△',batu:'×'};

  var listEl = document.getElementById('task-list');
  if (!listEl) return;
  if (tasks.length === 0) {
    listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">🎉</div>今日の復習タスクはありません！<br><span style="font-size:12px">「進捗」から新しい問題を学習しましょう</span></div>';
  } else {
    listEl.innerHTML = tasks.map(function(t) {
      var done = sessionStorage.getItem('done_' + t.pid);
      var lr = (state[t.pid] && state[t.pid].result) || 'maru';
      return '<div class="task-card ' + (done ? 'done' : '') + '" id="tc-' + t.pid + '" onclick="openTaskModal(\'' + t.pid + '\')">' +
        '<div class="task-checkbox">✓</div>' +
        '<div class="task-info"><div class="task-num">問題 ' + t.pid + '</div>' +
        '<div class="task-meta">' + t.ch + '&nbsp;前回: <span style="color:' + chipCols[lr] + ';font-weight:700">' + chipLbls[lr] + '</span></div></div>' +
        '<span class="task-badge ' + bCls[t.stage] + '">' + bLbl[t.stage] + '</span></div>';
    }).join('');
  }

  // Weak problems
  var weakProbs = Object.keys(state).filter(function(pid) {
    var s = state[pid];
    return s && s.result === 'batu' && (s.reviews||[]).length < 3 && !isDueToday(pid);
  });
  var wt = document.getElementById('weak-title');
  var wl = document.getElementById('weak-list');
  if (weakProbs.length > 0) {
    if (wt) wt.style.display = '';
    if (wl) wl.innerHTML = weakProbs.slice(0, 8).map(function(pid) {
      var ch = CHAPTERS.find(function(c) { return getProblems(c).indexOf(pid) !== -1; });
      return '<div class="weak-card" onclick="openTaskModal(\'' + pid + '\')">' +
        '<span style="color:var(--red);font-weight:700;font-size:15px">×</span>' +
        '<div class="task-info"><div class="task-num">問題 ' + pid + '</div>' +
        '<div class="task-meta">' + (ch ? ch.name : '') + '</div></div>' +
        '<span style="font-size:11px;color:var(--text3)">次の復習: ' + nextReviewDate(pid) + '</span></div>';
    }).join('');
  } else {
    if (wt) wt.style.display = 'none';
    if (wl) wl.innerHTML = '';
  }
}

// ===== CALENDAR =====
function initCal() {
  var now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
}

function buildActMap() {
  var actMap = {};
  Object.keys(state).forEach(function(pid) {
    var s = state[pid];
    if (!s) return;
    function addAct(ts) {
      var d = new Date(ts); d.setHours(0,0,0,0);
      var k = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
      actMap[k] = (actMap[k] || 0) + 1;
    }
    addAct(s.learnedAt);
    (s.reviews||[]).forEach(addAct);
  });
  return actMap;
}

function renderCalendar() {
  var now = new Date();
  var label = document.getElementById('cal-month-label');
  if (label) label.textContent = calYear + '年 ' + (calMonth + 1) + '月';
  var actMap = buildActMap();
  var grid = document.getElementById('cal-grid');
  if (!grid) return;
  var dows = ['日','月','火','水','木','金','土'];
  var html = dows.map(function(d) { return '<div class="cal-dow">' + d + '</div>'; }).join('');
  var firstDay = new Date(calYear, calMonth, 1).getDay();
  for (var i = 0; i < firstDay; i++) html += '<div></div>';
  var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  var todayKey = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate();
  for (var day = 1; day <= daysInMonth; day++) {
    var k = calYear + '-' + calMonth + '-' + day;
    var isToday = (k === todayKey);
    var cnt = actMap[k] || 0;
    var cls = 'cal-day' + (cnt > 0 ? ' has-activity' : '') + (isToday ? ' today' : '');
    html += '<div class="' + cls + '"><span>' + day + '</span>' + (cnt > 0 ? '<span class="cal-day-count">' + cnt + '</span>' : '') + '</div>';
  }
  grid.innerHTML = html;
  renderWeeklyChart();
  renderRateChart();
}

function getWeekData(offsetWeeks) {
  var now = new Date(); now.setHours(0,0,0,0);
  var weekStart = new Date(now);
  weekStart.setDate(weekStart.getDate() - now.getDay() - offsetWeeks * 7);
  var total = 0, maru = 0;
  for (var d = 0; d < 7; d++) {
    var day = new Date(weekStart); day.setDate(day.getDate() + d);
    var dayTs = day.getTime();
    Object.keys(state).forEach(function(pid) {
      var s = state[pid];
      if (!s) return;
      function checkDay(ts) {
        var rd = new Date(ts); rd.setHours(0,0,0,0);
        if (rd.getTime() === dayTs) { total++; if (s.result === 'maru') maru++; }
      }
      checkDay(s.learnedAt);
      (s.reviews||[]).forEach(checkDay);
    });
  }
  return { total: total, maru: maru };
}

function renderWeeklyChart() {
  var el = document.getElementById('weekly-chart');
  if (!el) return;
  var weeks = [];
  for (var w = 7; w >= 0; w--) {
    var data = getWeekData(w);
    weeks.push({ cnt: data.total, current: w === 0 });
  }
  var max = Math.max.apply(null, weeks.map(function(w) { return w.cnt; })) || 1;
  el.innerHTML = weeks.map(function(w) {
    var pct = Math.round(w.cnt / max * 100);
    return '<div class="bar-wrap">' +
      '<div class="bar' + (w.current ? ' active' : '') + '" style="height:' + pct + '%;min-height:' + (w.cnt > 0 ? 3 : 2) + 'px"></div>' +
      '<div class="bar-label">' + (w.current ? '今' : '') + '</div>' +
      '<div class="bar-val">' + (w.cnt || '') + '</div></div>';
  }).join('');
}

function renderRateChart() {
  var el = document.getElementById('rate-chart');
  if (!el) return;
  var weeks = [];
  for (var w = 7; w >= 0; w--) {
    var data = getWeekData(w);
    var rate = data.total > 0 ? Math.round(data.maru / data.total * 100) : 0;
    weeks.push({ rate: rate, hasData: data.total > 0, current: w === 0 });
  }
  el.innerHTML = weeks.map(function(w) {
    return '<div class="bar-wrap">' +
      '<div class="bar' + (w.current ? ' active' : '') + '" style="height:' + w.rate + '%;min-height:' + (w.hasData ? 3 : 2) + 'px;' + (w.hasData ? 'background:var(--green)' : '') + '"></div>' +
      '<div class="bar-label">' + (w.current ? '今' : '') + '</div>' +
      '<div class="bar-val">' + (w.hasData ? w.rate + '%' : '') + '</div></div>';
  }).join('');
}

window.calPrev = function() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); };
window.calNext = function() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); };

// ===== PROGRESS =====
function renderProgress() {
  var grid = document.getElementById('chapters-grid');
  if (!grid) return;
  grid.innerHTML = CHAPTERS.map(function(ch, ci) {
    var probs = getProblems(ch);
    var total = probs.length;
    var done = probs.filter(function(p) { return state[p]; }).length;
    var mastered = probs.filter(function(p) { return state[p] && (state[p].reviews||[]).length >= 3; }).length;
    var pct = Math.round(done / total * 100);
    return '<div class="chapter-card" id="ch-card-' + ci + '">' +
      '<div class="chapter-header" onclick="toggleChapter(' + ci + ')">' +
      '<div><div class="chapter-name">' + ch.name + '</div><div class="chapter-range">' + total + '問 習得' + mastered + '問</div></div>' +
      '<div class="chapter-pct">' + pct + '%</div></div>' +
      '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="problem-grid" id="pg-' + ci + '">' +
      probs.map(function(pid) {
        var stage = getStage(pid);
        var hasMemo = state[pid] && state[pid].memo;
        return '<button class="prob-btn ' + (stage === 'unlearned' ? '' : stage) + (hasMemo ? ' has-memo' : '') + '" onclick="openModal(\'' + pid + '\',\'' + ch.name.replace(/'/g,'') + '\')">' + pid + '</button>';
      }).join('') + '</div></div>';
  }).join('');
}

window.toggleChapter = function(ci) {
  document.getElementById('ch-card-' + ci).classList.toggle('expanded');
};

// ===== MODAL =====
var modalPid = '', modalCh = '';
var pendingResult = 'maru';

function resultSelectorHTML(cur) {
  var opts = [{k:'maru',s:'○',l:'できた'},{k:'sanka',s:'△',l:'答えを見たら<br>わかった'},{k:'batu',s:'×',l:'答えを見ても<br>わからなかった'}];
  return '<div style="font-size:11px;color:var(--text3);margin-bottom:6px">この問題の結果</div>' +
    '<div class="result-selector">' +
    opts.map(function(o) {
      return '<button class="result-opt ' + (cur === o.k ? 'selected-' + o.k : '') + '" onclick="selectResult(\'' + o.k + '\')" id="ropt-' + o.k + '">' +
        '<span class="result-opt-sym">' + o.s + '</span><span class="result-opt-label">' + o.l + '</span></button>';
    }).join('') + '</div>';
}

function memoHTML(pid) {
  var memo = (state[pid] && state[pid].memo) || '';
  return '<div class="memo-label">📝 メモ（解法のポイントなど）</div>' +
    '<textarea class="memo-input" id="prob-memo" placeholder="ここにメモを入力...">' + memo + '</textarea>';
}

function nextReviewDate(pid) {
  var s = state[pid];
  if (!s) return '-';
  var rev = (s.reviews||[]).length;
  if (rev >= 3) return '完了';
  var dueTs = s.learnedAt + REVIEW_DAYS[rev] * 86400000;
  return new Date(dueTs).toLocaleDateString('ja-JP', {month:'long',day:'numeric'});
}

window.selectResult = function(key) {
  pendingResult = key;
  ['maru','sanka','batu'].forEach(function(k) {
    var el = document.getElementById('ropt-' + k);
    if (el) el.className = 'result-opt' + (k === key ? ' selected-' + k : '');
  });
};

window.openTaskModal = function(pid) {
  var ch = CHAPTERS.find(function(c) { return getProblems(c).indexOf(pid) !== -1; });
  openModal(pid, ch ? ch.name : '');
};

window.openModal = function(pid, chName) {
  modalPid = pid; modalCh = chName;
  var s = state[pid];
  var stage = getStage(pid);
  pendingResult = (s && s.result) || 'maru';
  document.getElementById('modal-title').textContent = '問題 ' + pid;
  document.getElementById('modal-sub').textContent = chName;

  var ds = daysSince(s && s.learnedAt);
  var stageLabel = { unlearned:'未学習', learned:'学習済（'+ds+'日経過）', 'learned-sanka':'学習済（'+ds+'日経過）', 'learned-batu':'学習済（'+ds+'日経過）', r1:'1回目復習の日！', r2:'2回目復習の日！', r3:'最終復習の日！', mastered:'完全習得済！', 'mastered-sanka':'完全習得済！', 'mastered-batu':'完全習得済！' }[stage] || stage;

  var actions = '<div style="font-size:12px;color:var(--text2);padding:5px 0;border-bottom:1px solid var(--border);margin-bottom:11px">' + stageLabel + '</div>';

  if (stage === 'unlearned') {
    actions += resultSelectorHTML('maru') + memoHTML(pid) +
      '<button class="modal-btn primary" onclick="learnProblem()">今日学習した<div class="modal-btn-sub">1回目の学習として記録</div></button>';
  } else if (['learned','learned-sanka','learned-batu'].indexOf(stage) !== -1) {
    actions += '<div style="font-size:11px;color:var(--text3);margin-bottom:10px">次回復習: ' + nextReviewDate(pid) + '</div>' +
      resultSelectorHTML(pendingResult) + memoHTML(pid) +
      '<button class="modal-btn primary" onclick="updateResult()">評価・メモを更新</button>' +
      '<button class="modal-btn" style="color:var(--red);border-color:rgba(248,113,113,0.3)" onclick="unlearn()">学習記録を削除</button>';
  } else if (['mastered','mastered-sanka','mastered-batu'].indexOf(stage) !== -1) {
    actions += '<div style="font-size:13px;color:var(--accent2);margin-bottom:10px;font-weight:600">🎉 すべての復習完了！</div>' +
      resultSelectorHTML(pendingResult) + memoHTML(pid) +
      '<button class="modal-btn primary" onclick="updateResult()">評価・メモを更新</button>' +
      '<button class="modal-btn" onclick="closeModalDirect()">閉じる</button>';
  } else {
    actions += resultSelectorHTML(pendingResult) + memoHTML(pid) +
      '<button class="modal-btn primary" onclick="reviewProblem()">復習完了！</button>' +
      '<button class="modal-btn" onclick="closeModalDirect()">後で</button>';
  }

  document.getElementById('modal-actions').innerHTML = actions;
  document.getElementById('modal').classList.add('open');
};

window.closeModalBg = function(e) { if (e.target === document.getElementById('modal')) closeModalDirect(); };
window.closeModalDirect = function() { document.getElementById('modal').classList.remove('open'); };

function getMemo() { var el = document.getElementById('prob-memo'); return el ? el.value.trim() : ''; }

window.learnProblem = function() {
  state[modalPid] = { learnedAt: todayTs(), reviews: [], result: pendingResult, memo: getMemo() };
  saveState(); closeModalDirect();
  showToast('問題' + modalPid + ' 学習記録しました');
  renderToday(); renderProgress(); updateStreak();
};

window.reviewProblem = function() {
  if (!state[modalPid]) state[modalPid] = { learnedAt: todayTs(), reviews: [] };
  state[modalPid].reviews = (state[modalPid].reviews || []).concat([todayTs()]);
  state[modalPid].result = pendingResult;
  state[modalPid].memo = getMemo();
  saveState();
  var taskEl = document.getElementById('tc-' + modalPid);
  if (taskEl) { taskEl.classList.add('done'); sessionStorage.setItem('done_' + modalPid, '1'); }
  closeModalDirect();
  var lbls = {maru:'○',sanka:'△',batu:'×'};
  showToast('問題' + modalPid + ' 復習完了 ' + lbls[pendingResult]);
  if ((state[modalPid].reviews||[]).length >= 3) launchConfetti();
  renderToday(); renderProgress(); updateStreak();
};

window.updateResult = function() {
  if (!state[modalPid]) return;
  state[modalPid].result = pendingResult;
  state[modalPid].memo = getMemo();
  saveState(); closeModalDirect();
  showToast('問題' + modalPid + ' 更新しました');
  renderToday(); renderProgress();
};

window.unlearn = function() {
  delete state[modalPid];
  saveState(); closeModalDirect();
  showToast('問題' + modalPid + ' の記録を削除しました');
  renderToday(); renderProgress();
};

// ===== CONFETTI =====
function launchConfetti() {
  var container = document.getElementById('confetti-container');
  if (!container) return;
  var colors = ['#6c63ff','#4ade80','#fbbf24','#f87171','#60a5fa','#f472b6','#a78bfa'];
  for (var i = 0; i < 60; i++) {
    (function(idx) {
      setTimeout(function() {
        var p = document.createElement('div');
        p.className = 'cp';
        p.style.cssText = 'left:' + (Math.random()*100) + 'vw;top:-10px;background:' + colors[Math.floor(Math.random()*colors.length)] + ';border-radius:' + (Math.random() > 0.5 ? '50%' : '2px') + ';animation-duration:' + (1.2 + Math.random()*1.5) + 's;animation-delay:' + (Math.random()*0.4) + 's;';
        container.appendChild(p);
        setTimeout(function() { if (p.parentNode) p.parentNode.removeChild(p); }, 3000);
      }, idx * 18);
    })(i);
  }
}

// ===== TABS =====
window.showTab = function(t) {
  ['today','calendar','progress','settings'].forEach(function(id) {
    var el = document.getElementById('tab-' + id);
    if (el) el.style.display = id === t ? '' : 'none';
    var bn = document.getElementById('bn-' + id);
    if (bn) bn.classList.toggle('active', id === t);
  });
  if (t === 'today') renderToday();
  if (t === 'calendar') { initCal(); renderCalendar(); }
  if (t === 'progress') renderProgress();
};

// ===== TOAST =====
window.showToast = function(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2200);
};

// ===== SETTINGS =====
window.resetData = function() {
  if (confirm('すべての学習データをリセットしますか？')) {
    state = {}; saveState(); showToast('データをリセットしました'); renderToday();
  }
};

window.exportData = function() {
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'focusgold_data.json';
  a.click();
};

initCal();
</script>
</body>
</html>
