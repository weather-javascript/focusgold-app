name: Generate Keystore (Run Once)
on:
  workflow_dispatch: # 手動実行のみ
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore release.jks \
            -alias my-key -keyalg RSA \
            -keysize 2048 -validity 10000 \
            -storepass kyouma123 \
            -keypass kyouma123 \
            -dname "CN=MyApp,O=MyOrg,C=JP"
      - name: Print Base64
        run: base64 -w 0 release.jks
